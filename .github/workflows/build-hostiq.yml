name: Build HOSTiQ upload package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-hostiq.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove server-only files from the static hosting build
        run: |
          rm -f middleware.ts
          rm -rf app/actions 'app/(root)' 'app/[lang]/prezentacja' components/sections/contact.tsx
      - run: npm run build
      - name: Finalize cPanel hosting files
        run: |
          mkdir -p out
          cp public/send-form.php out/send-form.php
          cat > out/.user.ini <<'INI'
          upload_max_filesize=5M
          post_max_size=12M
          max_file_uploads=4
          max_execution_time=60
          INI
          cat > out/.htaccess <<'HTACCESS'
          DirectoryIndex index.html
          Options -Indexes
          AddDefaultCharset UTF-8
          RewriteEngine On
          RewriteRule ^cs(?:/(.*))?/?$ /cz/$1 [R=308,L,NE]
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
          </IfModule>
          <FilesMatch "(^\.|\.(env|ini|log|sql|bak|config)$)">
            Require all denied
          </FilesMatch>
          HTACCESS
          cat > out/index.html <<'HTML'
          <!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/pl/"><link rel="canonical" href="https://silvotech.eu/pl/"><title>SilvoTech</title><script>location.replace('/pl/');</script></head><body><p><a href="/pl/">Przejdź do strony SilvoTech</a></p></body></html>
          HTML
      - name: Verify hosting package
        run: |
          test -f out/index.html
          test -f out/send-form.php
          test -f out/.htaccess
          test -d out/pl
          test -d out/en
          test -d out/de
          test -d out/cz
          test -d out/sk
      - name: Create upload archive
        run: cd out && zip -qr ../silvotech-hostiq-upload.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: silvotech-hostiq-upload
          path: silvotech-hostiq-upload.zip
          if-no-files-found: error
          retention-days: 14
